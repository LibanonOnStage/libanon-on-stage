<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOS Backstage</title>
<meta name="application-name" content="LOS Backstage">
<meta name="apple-mobile-web-app-title" content="LOS">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1C2130; --muted:#5E6575; --line:#E1E4EA;
  --red:#C8102E; --red-soft:#FBE8EB; --gold:#E9A800; --gold-soft:#FFF4D4;
  --green:#2F7D57; --green-soft:#E3F2EA; --amber:#A8650B;
  --side:#1C2130; --side-ink:#E9EBF1; --side-muted:#9AA1B2;
  --radius-s:6px; --radius-m:10px;
  --head:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151E; --surface:#1B1F2B; --ink:#ECEEF3; --muted:#A3AABA; --line:#2B3141;
    --red:#E8455A; --red-soft:#3A1D24; --gold:#F2C03A; --gold-soft:#3A3018;
    --green:#5BBF8C; --green-soft:#183026; --amber:#E0A04A;
    --side:#0E1118; --side-ink:#E9EBF1; --side-muted:#8B92A3;
  }
}
:root[data-theme="dark"]{
  --bg:#12151E; --surface:#1B1F2B; --ink:#ECEEF3; --muted:#A3AABA; --line:#2B3141;
  --red:#E8455A; --red-soft:#3A1D24; --gold:#F2C03A; --gold-soft:#3A3018;
  --green:#5BBF8C; --green-soft:#183026; --amber:#E0A04A;
  --side:#0E1118; --side-ink:#E9EBF1; --side-muted:#8B92A3;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
img{max-width:100%}
a{color:var(--red)}

/* Shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--head);font-weight:700;font-size:28px;line-height:1;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--side-muted);margin-top:6px;letter-spacing:0}
.brand .cross{display:inline-block;width:14px;height:14px;background:var(--red);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%);margin-right:8px;vertical-align:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--radius-s);color:var(--side-ink);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:var(--red);color:#fff}
.nav button:focus-visible{outline:2px solid var(--gold)}
.nav .count{font-size:12px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px}
.side-foot{margin-top:auto;font-size:13px;color:var(--side-muted)}
.side-foot button{all:unset;cursor:pointer;text-decoration:underline}

.main{min-width:0;padding:22px clamp(16px,3vw,40px) 60px}
.wrap{max-width:1120px;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.topbar .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.yearsel{max-width:100%;font-family:var(--head);font-weight:700;font-size:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:5px 10px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:3px}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:4px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--red)}
.demo-note{font-size:13px;color:var(--muted)}
.rolesel{display:none}
html,body{overflow-x:hidden}
@supports (overflow-x:clip){html,body{overflow-x:clip}}
@media (max-width:760px){
  .topbar{gap:8px;margin-bottom:16px}
  .topbar .left{width:100%;gap:8px}
  .topbar .yearsel{width:100%;font-size:17px}
  .topbar .seg{display:none}
  .rolesel{display:flex;align-items:center;gap:8px;width:100%;font-size:13px;color:var(--muted);font-weight:600}
  .rolesel select{flex:1;min-width:0}
  input,select,textarea{font-size:16px}
  select{max-width:100%}
  #app{overflow-wrap:break-word}
  .regx,.list b,.tname b{overflow-wrap:anywhere}
  nav.bottomnav button{white-space:nowrap;overflow-wrap:normal;font-size:11.5px;padding:10px 1px 9px}
  .seg{flex-wrap:wrap;max-width:100%}
  label.f{max-width:100%;min-width:0}
  label.f>select,label.f>input:not([type=checkbox]):not([type=radio]),label.f>textarea{width:100%;min-width:0}
}
@media (max-width:520px){
  .form .grid{grid-template-columns:1fr}
  .form .grid>*{grid-column:1/-1!important}
}

h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,5vw,48px);line-height:1;margin:0 0 6px;letter-spacing:-.005em}
h2{font-family:var(--head);font-weight:600;font-size:26px;line-height:1.1;margin:0 0 12px}
h3{font-family:var(--head);font-weight:600;font-size:20px;line-height:1.15;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 24px;max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--head);font-weight:600;font-variant-numeric:tabular-nums}

.banner{border-left:4px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 var(--radius-s) var(--radius-s) 0;margin-bottom:20px;font-size:15px}
.section{margin-bottom:34px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.list{list-style:none;margin:0;padding:0}
.list>li{padding:12px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:6px}

.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--radius-s);font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.tag.red{background:var(--red-soft);border-color:transparent;color:var(--red)}
.tag.gold{background:var(--gold-soft);border-color:transparent;color:var(--amber)}
.tag.green{background:var(--green-soft);border-color:transparent;color:var(--green)}
select,input[type=text],input[type=tel],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:62px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tabs button:focus-visible{outline:2px solid var(--red)}
.scroll-x{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--red)}
.bar.green>span{background:var(--green)}
.bar.gold>span{background:var(--gold)}

/* The one bold element: the funding meter */
.stage{background:var(--side);color:var(--side-ink);border-radius:var(--radius-m);padding:26px clamp(18px,3vw,32px) 22px;margin-bottom:30px}
.stage .claim{font-family:var(--head);font-weight:600;font-size:clamp(24px,3.4vw,34px);line-height:1.12;max-width:30ch;margin:0 0 22px}
.stage .claim b{color:var(--gold);font-weight:700}
.meter{position:relative;height:46px;display:flex;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.08)}
.meter .seg1,.meter .seg2{position:relative;height:100%;overflow:hidden}
.meter .seg1{border-right:3px solid var(--side)}
.meter .fill1{position:absolute;inset:0 auto 0 0;background:var(--red)}
.meter .fill2{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.meter-legend{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:14px;color:var(--side-muted);flex-wrap:wrap}
.meter-legend b{color:var(--side-ink);font-weight:600}
.stage-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px;border-top:1px solid rgba(255,255,255,.12);padding-top:16px}
.stage-stats .v{font-family:var(--head);font-weight:600;font-size:26px;line-height:1}
.stage-stats .k{font-size:13px;color:var(--side-muted);margin-top:4px}
@media (prefers-reduced-motion:no-preference){
  .meter .fill1,.meter .fill2{animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
  .meter .fill2{animation-delay:.9s}
  @keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
}

/* Shows */
.show{display:grid;grid-template-columns:92px 1fr 150px;gap:14px;align-items:center}
.show .date{font-family:var(--head);font-weight:600;font-size:18px;line-height:1.05}
.show .date span{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.show .sold{font-family:var(--head);font-weight:600;font-size:22px;text-align:right}
.show .sold span{font-size:15px;color:var(--muted);font-weight:500}
.stackbar{display:flex;height:10px;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);margin-top:6px}
.stackbar .on{background:var(--red)} .stackbar .box{background:var(--gold)}

/* Call sheet */
.callsheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden}
.cs-head{padding:18px 20px;border-bottom:2px dashed var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cs-head .who{font-family:var(--head);font-weight:700;font-size:30px;line-height:1}
.cs-body{display:grid;grid-template-columns:1.4fr 1fr}
.cs-body>div{padding:18px 20px}
.cs-body>div+div{border-left:1px solid var(--line)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .tm{font-family:var(--head);font-weight:600;font-size:20px;line-height:1.1}
.timeline .me{box-shadow:inset 3px 0 0 var(--red);padding-left:10px}
.fact{padding:10px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0;padding-top:0}
.fact .k{font-size:13px;color:var(--muted);font-weight:500}
.fact .v{font-weight:600}
.daypills{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.daypills button{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:7px 12px;white-space:nowrap;font-weight:500}
.daypills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daypills button:focus-visible{outline:2px solid var(--red)}

/* Cars */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:22px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:14px}
.car.warn{border-color:var(--red)}
.car .seats{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
.car .seat{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line)}
.car .seat.f{background:var(--ink);border-color:var(--ink)}
.car .seat.d{background:var(--red);border-color:var(--red)}
.car .seat.x{background:var(--gold);border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}

/* Probenplan */
.block{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.block:first-child{border-top:0}
.block.dim{opacity:.42}
.block.hit .bt{color:var(--red)}
.block .bt{font-family:var(--head);font-weight:600;font-size:19px;line-height:1.1}

/* Kanban-ish tasks */
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:19px;height:19px;margin-top:3px;accent-color:var(--green)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.phase{margin-bottom:22px}
.phase h3{display:flex;gap:10px;align-items:baseline}

.kpi{display:grid;grid-template-columns:minmax(0,1fr) 140px 52px;gap:10px;align-items:center;padding:7px 0}
.cmp{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cmp:first-child{border-top:0}
.cmp .bars{display:flex;flex-direction:column;gap:5px}
.cmp .b{display:flex;align-items:center;gap:8px;font-size:13px}
.cmp .b i{display:block;height:12px;border-radius:3px;background:var(--muted)}
.cmp .b.y27 i{background:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius-s);font-weight:500;z-index:50;max-width:min(92vw,520px)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius-m)}

/* Mobile */
.mtop,.bottomnav,.sheet{display:none}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .mtop .brand{font-size:22px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
  .bottomnav button{all:unset;cursor:pointer;text-align:center;padding:10px 4px 9px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .bottomnav button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
  .bottomnav button[aria-current="page"]{color:var(--red)}
  .sheet.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .sheet .inner{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:14px 14px 0 0;padding:16px 16px calc(80px + env(safe-area-inset-bottom,0px))}
  .sheet .inner button{all:unset;cursor:pointer;display:block;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:600;width:100%}
  .grid2,.grid3{grid-template-columns:1fr}
  .stage-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .show{grid-template-columns:70px 1fr;}
  .show .sold{grid-column:1 / -1;text-align:left}
  .cs-body{grid-template-columns:1fr}
  .cs-body>div+div{border-left:0;border-top:1px solid var(--line)}
  .block{grid-template-columns:84px 1fr}
  .cmp{grid-template-columns:1fr}
  .kpi{grid-template-columns:minmax(0,1fr) 90px 44px}
}
</style>

<style>
/* v2 additions */
.cluster{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cluster:first-child{border-top:0}
.ev{border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;background:var(--surface)}
.ev .et{font-family:var(--head);font-weight:600;font-size:19px;line-height:1.1}
.ev.mine{border-color:var(--red);background:var(--red-soft);box-shadow:inset 4px 0 0 var(--red)}
.ev.mine .et{color:var(--red)}
.ev .you{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:20px;margin-left:6px;vertical-align:2px}
.ev .acts{display:flex;gap:6px;margin-top:8px}
.ev .acts .btn{padding:4px 9px;font-size:13px}
.ev .note{margin-top:8px;padding:6px 9px;border-radius:5px;background:var(--gold-soft);color:var(--ink);font-size:13.5px;border-left:3px solid var(--gold)}
.cf-wrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:60;padding:16px}
.cf{background:var(--surface);color:var(--ink);border-radius:var(--radius-m);padding:18px 20px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cf p{margin:0 0 14px;font-weight:500}
.cast-t td{vertical-align:top}
.cast-t td:first-child{white-space:nowrap}
.cast-t select{min-width:170px}
.cm-cell{min-width:240px}
.cm-cell input{width:100%;margin-top:4px}
.cm-line{font-size:13.5px;line-height:1.35;padding:1px 0}
.cm-line b{font-weight:600}
.cost-t input[type=text]{min-width:0;width:100%}
.cost-t select{max-width:150px}
.cost-t .numin{width:92px;text-align:right}
.cost-t th,.cost-t td{padding:7px 6px}
.cost-t td.c-name{min-width:170px;width:40%}
.cost-t td.c-del{width:34px;text-align:center}
.cost-t td.c-del .btn{padding:4px 6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 18px}
.kpis>div+div{border-left:1px solid var(--line);padding-left:14px}
.kpis .k{font-size:13px;color:var(--muted)}
.kpis .v{font-family:var(--head);font-weight:600;font-size:28px;line-height:1.1}
.kpis .s{font-size:12px;color:var(--muted)}
.cost-t input,.cost-t select,.inc-list input{padding:4px 7px;font-size:14px}
table.t.cost-t th{padding:4px 6px}
table.t.cost-t td{padding:3px 6px}
.inc-list>li{padding:7px 0}
.money-grid .panel{padding:14px 16px}
@media (max-width:880px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis>div:nth-child(3){border-left:0;padding-left:0}}
.money-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1180px){.money-grid{grid-template-columns:1fr}}
@media (max-width:700px){
  .cost-t thead{display:none}
  .cost-t,.cost-t tbody{display:block}

<script>
/* ===================== Hilfsfunktionen ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = n => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const nf = n => new Intl.NumberFormat('de-DE').format(n||0);
const pct = n => new Intl.NumberFormat('de-DE',{maximumFractionDigits:0}).format(n) + ' %';
const d0 = iso => new Date(iso + 'T12:00:00');
const fDate = (iso, o={weekday:'short',day:'numeric',month:'numeric'}) => d0(iso).toLocaleDateString('de-DE', o);
const fLong = iso => fDate(iso,{weekday:'long',day:'numeric',month:'long'});
const todayIso = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const daysUntil = iso => Math.round((d0(iso) - d0(todayIso())) / 864e5);
const uid = p => p + '-' + Math.random().toString(36).slice(2,8);
const val = id => (document.getElementById(id)?.value ?? '').trim();

const GROUPS={ensemble:'Schauspiel',band:'Band',technik:'Ton & Licht',bautrupp:'Bautrupp',kostuem:'Kostüm',requisite:'Requisite','fruehes-team':'Frühes Team',leitung:'Leitung',regie:'Regie & Regieassistenz'};
const SYS_GROUPS={'fruehes-team':'Frühes Team'};
const gLabel=(id,y)=>{y=y||Y(); const c=y&&(y.crews||[]).find(x=>x.g===id); return c?c.label:(SYS_GROUPS[id]||GROUPS[id]||id);};
const crewsOf=(p,y)=>{y=y||Y(); return (y.crews||[]).filter(c=>(p.groups||[]).includes(c.g));};
const normName=n=>String(n||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const ACCESS={'leitung-ext':'Leitung – Externe Leitung','leitung-int':'Leitung – Interne Leitung','leitung-log':'Leitung – Logistik & Finanzen','leitung-mfd':'Leitung – Marketing & Fundraising',regie:'Regie',ra:'Regieassistenz',team:'Team (Ensemble & Gewerke)'};

/* ===================== Google-Formular ===================== */
function splitW(t){return String(t||'').split(/,\s*(?![^()]*\))/).map(x=>x.trim()).filter(Boolean);}
function RG(id,firstName,last,wish,date,x={}){const name=firstName+' '+last;const [Y4,M,D]=date.split('-');
  return {id,source:'form',key:(firstName+'.'+last+'@beispiel.de').toLowerCase(),name,firstName,lastName:last,email:(firstName+'.'+last+'@beispiel.de').toLowerCase(),phone:'+49 170 0000'+id.slice(1).padStart(3,'0'),addr:'Musterstraße '+id.slice(1)+', 12345 Musterstadt',
    ts:`${D}.${M}.${Y4} 18:00:00`,date,avail:'Ja',tight:'Gar nicht',been:'',wishes:splitW(wish),wish,roleWish:'',height:'',exp:'',photoLink:'',diet:'',probeNote:'',driver:false,licLinks:[],car:'',referral:'',notes:'',bed:false,birth:'',status:'neu',...x};}
const FORM_COLS=[
  ['ts','Zeitstempel','Angemeldet am',/^zeitstempel|^timestamp/i],
  ['avail','Ich habe mir die Daten angeschaut …','Termine bestätigt',/daten angeschaut|keine andere verpflichtung/i],
  ['tight','Wann/Wo könnte es zeitlich eng werden?','Zeitlich eng',/eng werden/i],
  ['lastName','Nachname','Nachname',/^nachname/i],
  ['firstName','Vorname','Vorname',/^vorname/i],
  ['birth','Geburtsdatum','Geburtsdatum / Alter',/geburts/i],
  ['email','E-Mail Adresse','E-Mail (erkennt Doppelte)',/^e-?mail/i],
  ['phone','Handynummer','Telefon',/^handy/i],
  ['addr','Adresse','Adresse',/^adresse/i],
  ['been','Ich war','Erfahrung LOS / Libanon',/^ich war/i],
  ['wish','Aufgabenwunsch','Gewerk-Wunsch → Gruppe im Team',/aufgabenwunsch/i],
  ['roleWish','Nur falls du Schauspieler sein willst','Rollenwunsch',/schauspieler sein willst/i],
  ['height','Wie groß bist du? (cm)','Größe',/wie gro/i],
  ['exp','Bühnen- bzw. Schauspielerfahrung','Bühnenerfahrung',/erfahrung/i],
  ['photoLink','Bild von dir (Drive)','Foto in der Besetzung',/bild von dir/i],
  ['diet','Essgewohnheiten, Allergien …','Verpflegung',/essgewohnheit|allergi/i],
  ['probeNote','Sonstige Mitteilungen Probewoche','Hinweis Probewoche',/mitteilungen/i],
  ['driver','Als Fahrer zur Verfügung?','Fahrer',/als fahrer/i],
  ['licLinks','Bild des Führerscheins (Drive)','Führerschein (nur Leitung)',/führerschein/i],
  ['car','Auto mit x Plätzen','Fahrzeug-Angebot',/auto mit/i],
  ['referral','Diese Person braucht das Formular …','Empfehlung',/braucht das formular/i],
  ['notes','Weitere Infos, Anmerkungen, Fragen','Anmerkungen',/weitere infos/i],
  ['bed','Ich brauche ein Bett für die Probewoche?','Bett Probewoche',/bett/i],
];
function parseSheet(t){
  t=String(t||'').replace(/\r\n?/g,'\n'); if(!t.trim()) return [];
  const delim=t.split('\n')[0].includes('\t')||(!t.split('\n')[0].includes(',')&&t.includes('\t'))?'\t':',';
  const rows=[];let row=[],cell='',q=false,start=true;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; continue; }
    if(c==='"'&&start){q=true;start=false;continue;}
    if(c===delim){row.push(cell);cell='';start=true;continue;}
    if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';start=true;continue;}
    cell+=c;start=false;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
const deDate=v=>{const m=String(v||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; const n=String(v||'').match(/(\d{4})-(\d{2})-(\d{2})/); return n?n[0]:'';};
const driveId=u=>{const m=String(u||'').match(/[?&]id=([\w-]+)/)||String(u||'').match(/\/d\/([\w-]+)/); return m?m[1]:'';};
const driveThumb=u=>{const id=driveId(u); return id?`https://drive.google.com/thumbnail?id=${id}&sz=w400`:'';};
function importSheet(y,text){ return importRows(y,parseSheet(text)); }
function importRows(y,rows){
  rows=(rows||[]).map(r=>(r||[]).map(c=>c==null?'':String(c))); if(rows.length<2) return {error:'Keine Daten erkannt. Bitte inklusive Kopfzeile einfügen.'};
  const head=rows[0].map(h=>h.trim()), idx={}, used=new Set();
  FORM_COLS.forEach(([k,,,re])=>{const i=head.findIndex((h,j)=>!used.has(j)&&re.test(h)); if(i>-1){idx[k]=i;used.add(i);}});
  if(idx.email==null&&(idx.lastName==null||idx.firstName==null)) return {error:'Spalten „E-Mail“ bzw. „Vorname/Nachname“ nicht gefunden. Bitte die Kopfzeile mitkopieren.'};
  let added=0,updated=0,skipped=0;
  rows.slice(1).forEach(r=>{ if(!r.some(c=>String(c).trim())) return;
    const g=k=>idx[k]!=null?String(r[idx[k]]||'').trim():'';
    const firstName=g('firstName'), lastName=g('lastName'), email=g('email').toLowerCase(), name=`${firstName} ${lastName}`.trim();
    if(!name&&!email){skipped++;return}
    const key=(email||'')+'|'+normName(name);
    const data={source:'form',key,name:name||email,firstName:firstName||name.split(' ')[0],lastName,email,phone:g('phone'),addr:g('addr'),ts:g('ts'),date:deDate(g('ts'))||todayIso(),
      avail:g('avail'),tight:g('tight'),been:g('been'),wishes:splitW(g('wish')),wish:splitW(g('wish')).join(', '),roleWish:g('roleWish'),height:g('height'),exp:g('exp'),
      photoLink:g('photoLink').split(/,\s*/)[0]||'',diet:g('diet'),probeNote:g('probeNote'),driver:/^ja/i.test(g('driver')),licLinks:g('licLinks').split(/,\s*/).filter(Boolean),
      car:g('car'),referral:g('referral'),notes:g('notes'),bed:/^ja/i.test(g('bed')),birth:deDate(g('birth'))};
    const ex=y.registrations.find(x=>x.key===key||(normName(x.name)===normName(name)&&(email?x.email===email:!x.email)));
    if(ex){Object.assign(ex,data);updated++;} else {y.registrations.push({id:'r-'+fnv(key),status:'neu',...data});added++;}
  });
  y.formImport={at:new Date().toISOString(),added,updated,skipped,found:Object.keys(idx)};
  return {added,updated,skipped,found:Object.keys(idx).length};

function mailList(ps){ const isL=p=>/^leitung/.test(p.access||'')||crewOf(p)?.g==='leitung';
  const cc=[...new Set(ps.filter(isL).flatMap(p=>mails(p.email)))], bcc=[...new Set(ps.filter(p=>!isL(p)).flatMap(p=>mails(p.email)))].filter(m=>!cc.includes(m));

function copyAddrs(list){ if(!list.length){toast('Keine Adressen vorhanden.');return}
  const txt=list.join('; ');
  const done=()=>toast(`${list.length} Adressen kopiert – im Mailprogramm ins BCC einfügen.`);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>window.prompt('Adressen kopieren (Strg + C):',txt)); else window.prompt('Adressen kopieren (Strg + C):',txt); }

function teamMail(ps){ if(!ps.length){toast('Bitte erst Personen auswählen.');return}
  const {cc,bcc,none}=mailList(ps), y=Y();
  if(!cc.length&&!bcc.length){toast('Keine der ausgewählten Personen hat eine E-Mail-Adresse.');return}
  const single=cc.length+bcc.length===1;
  const to=single?[...cc,...bcc]:[]; const q=[];
  if(!single&&cc.length) q.push('cc='+encodeURIComponent(cc.join(',')));
  const sub='subject='+encodeURIComponent(`Libanon on Stage ${y.year}: `), body='body='+encodeURIComponent(`${MAIL_HINT}\n\n\n\nViele Grüße\neure LOS-Leitung`);
  const withBcc=`mailto:${to.map(encodeURIComponent).join(',')}?${[...q,...(!single&&bcc.length?['bcc='+encodeURIComponent(bcc.join(','))]:[]),sub,body].join('&')}`;
  const open=h=>{const a=document.createElement('a'); a.href=h; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();};
  const warn=none.length?` Ohne Adresse: ${none.join(', ')}.`:'';
  if(withBcc.length<=1900){ open(withBcc); if(warn) toast(warn.trim()); return; }
  ask(`Das sind ${bcc.length} Adressen – zu viele für einen Mail-Link, manche Mailprogramme schneiden sie ab. Die BCC-Adressen werden kopiert; füge sie im Mailprogramm mit Strg + V ins BCC ein.${warn}`,'Kopieren & Mail öffnen',()=>{
    copyAddrs(bcc); open(`mailto:?${[...q,sub,body].join('&')}`); }); }
function openMail(r){const h=mailHref(r); if(!h) return; const a=document.createElement('a'); a.href=h; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();}

function toDocs(st){
  const out={}, leit=auth.role==='leitung';
  out['app/about']=st.about||{};
  if(leit) out['app/history']={h:st.history||{}};
  Object.values(st.years).forEach(y=>{
    const b='years/'+y.year, fb=y.feedback||{};
    const t={}; YEAR_KEYS.forEach(k=>{ if(y[k]!==undefined) t[k]=y[k]; });
    t.year=+y.year; t.archived=!!y.archived; t.fbOpen=!!fb.open; t.fbQuestions=fb.questions||[];
    out[b]=t;
    const skip=new Set([...YEAR_KEYS,...COLL_TEAM,...COLL_LEAD,'questions','feedback','pubMoney']);
    const l={}; Object.keys(y).forEach(k=>{ if(!skip.has(k)) l[k]=y[k]; });
    l.fbResults=fb.results||null; l.learnings=fb.learnings||[];
    out[b+'/lead/data']=l;
    const put=(c,arr)=>(arr||[]).forEach((it,i)=>{ if(it&&it.id) out[`${b}/${c}/${safeId(it.id)}`]={...it,_o:i}; });
    [...COLL_TEAM,...COLL_LEAD].forEach(c=>put(c,y[c]));
    put('responses',fb.responses);
    put('questions',y.questions);
    if(leit){
      put('cands',(y.registrations||[]).filter(r=>r.status==='neu'||r.status==='Warteliste').map(candOf));
      out[b+'/pub/money']=money(y);
    }
  });
  if(leit){ /* Zugänge entstehen aus den Personen aller offenen Jahre */
    const U={};
    Object.values(st.years).filter(y=>!y.archived).forEach(y=>(y.people||[]).forEach(p=>{
      mails(p.email).forEach(m=>{const u=U[m]||(U[m]={name:p.name,access:p.access||'team',pids:{},all:{}});
        (u.all[y.year]=u.all[y.year]||[]).push(p.id);
        if(!u.pids[y.year]||RANK[ROLE_OF(p.access||'team')]>RANK[ROLE_OF(u.access)]) u.pids[y.year]=p.id;
        if(RANK[ROLE_OF(p.access||'team')]>RANK[ROLE_OF(u.access)]){u.access=p.access;u.name=p.name;}});}));
    Object.entries(U).forEach(([m,u])=>out['users/'+m]=u);
  }
  return out;
}

    const s=stable(d), was=isDerived(p)?(srv.has(p)?stable(srv.get(p)):null):base.get(p); if(s!==was) ops.push({p,d}); }
  for(const p of base.keys()) if(!(p in want)&&canWrite(p)) ops.push({p,del:true});
  if(auth.role==='leitung'){ const hasUsers=Object.keys(want).some(p=>p.startsWith('users/'));
    const gone=p=>{const m=p.match(/^years\/(\d+)\//); return !!m&&!S.years[m[1]];}; /* Reste gelöschter Jahre immer mit entfernen */
    for(const p of srv.keys()) if(isDerived(p)&&!(p in want)&&canWrite(p)&&(fresh||gone(p))&&(hasUsers||!p.startsWith('users/'))) ops.push({p,del:true}); }
  base=new Map(Object.entries(want).filter(([p])=>!isDerived(p)).map(([p,d])=>[p,stable(d)]));

  const yr=p=>/^years\/\d+$/.test(p), rank=o=>o.del?(yr(o.p)?3:2):(yr(o.p)?0:1);
  ops.sort((a,b)=>rank(a)-rank(b));

    for(let i=0;i<ops.length;i+=400){ const b=FB.fs.writeBatch(db);

}

      const ev=(j.events||[]).filter(e=>String(e.when||'').slice(0,10)===s.date&&(!s.regiondoId||String(e.product)===String(s.regiondoId))&&(!same||String(e.when).slice(11,16)===s.time));
      if(ev.length){ s.sold=ev.reduce((a,e)=>a+(+e.qty||0),0); matched++; }});
    y.regiondo={at:new Date().toISOString(),matched};
    commit(silent?null:`Regiondo abgeglichen: ${matched} von ${y.shows.length} Vorstellungen gefunden.`);
  }catch(e){ console.error(e); if(!silent) toast('Regiondo-Abgleich fehlgeschlagen: '+(e.message||e)); }
}

const costOf=c=>c.closed?(+c.actual||0):(+c.plan||0); /* offen: Plan · abgerechnet: Ist */
function money(y){
  if(y.pubMoney) return y.pubMoney;
  const tickets=y.shows.reduce((s,x)=>s+x.sold*x.price,0);
  const box=y.shows.reduce((s,x)=>s+(+x.boxCash||0),0);
  const oth=y.other.reduce((s,x)=>s+(+x.amount||0),0);
  const don=(+y.donCash||0)+(+y.donOnline||0);
  const income=tickets+box+don+oth;
  const plan=y.costs.reduce((s,x)=>s+x.plan,0), actual=y.costs.reduce((s,x)=>s+(+x.actual||0),0);
  const expected=y.costs.reduce((s,x)=>s+costOf(x),0);
  const surplus=Math.max(0,income-expected);
  const audience=y.shows.reduce((s,x)=>s+x.sold+(+x.boxCount||0),0);
  return {tickets,box,don,oth,income,plan,actual,expected,surplus,audience,saldo:income-actual,forecast:income-expected};
}

/* ===================== Ablauf-Logik ===================== */
function tokLabel(t){
  if(t==='alle') return 'Alle';
  const [k,id]=t.split(':');
  if(k==='g') return gLabel(id);
  if(k==='r'){const r=Y().roles.find(x=>x.id===id); if(!r) return '';
    return r.name+(r.person&&r.status!=='abgelehnt'?' ('+castLabel(r.person,true)+')':'');}
  if(k==='p') return pname(id);
  return t;
}
function needs(ev,pid){
  if(!pid) return false; const p=person(pid); if(!p) return false;
  return ev.who.some(t=>{
    if(t==='alle') return true;
    const [k,id]=t.split(':');
    if(k==='g') return p.groups.includes(id);
    if(k==='p') return id===pid;
    if(k==='r'){const r=Y().roles.find(x=>x.id===id); return r&&r.person===pid&&r.status!=='abgelehnt';}
    return false;});
}
function clusters(evs){
  const s=[...evs].sort((a,b)=>a.from.localeCompare(b.from)||a.to.localeCompare(b.to));
  const out=[]; let cur=null, end='';
  s.forEach(e=>{ if(cur&&e.from<end){cur.push(e); if(e.to>end) end=e.to;} else {cur=[e]; out.push(cur); end=e.to;} });
  return out;
}

const DAY_KINDS=[['probe','Probewoche'],['tour','Tour'],['sonst','Sonstiger Tag']];
function dayGroups(dates,y){ const out=[]; let cur=null, prev=null, tn=0;
  dates.forEach(d=>{ const k=y.days[d]?.kind==='probe'?'probe':y.days[d]?.kind==='tour'?'tour':'sonst';
    const gap=prev&&(d0(d)-d0(prev))/864e5>2;
    if(!cur||cur.k!==k||(k!=='sonst'&&gap)){ cur={k,label:k==='probe'?'Probewoche':k==='tour'?'Tour-Wochenende '+(++tn):'Weitere Tage',dates:[]}; out.push(cur); }
    cur.dates.push(d); prev=d; });
  out.forEach(g=>{ if(g.k!=='sonst'&&g.dates.length>1) g.label+=` · ${fDate(g.dates[0],{day:'numeric',month:'numeric'})}–${fDate(g.dates[g.dates.length-1],{day:'numeric',month:'numeric'})}`; });
  return out; }

const firstTime=(y,date)=>y.events.filter(e=>e.date===date).map(e=>e.from).sort()[0]||'';
function leitTargets(y){

}
function teamTargets(y){
  const out=y.milestones.filter(m=>m.team).map(m=>{const t=m.time||''; return {at:m.date+'T'+(t||'00:00'),label:m.label,sub:fLong(m.date)+(t?`, ${t} Uhr`:'')};}); const probe=Object.keys(y.days).filter(d=>y.days[d].kind==='probe').sort()[0];
  if(probe){const t=firstTime(y,probe); out.push({at:probe+'T'+(t||'00:00'),label:'Probewoche',sub:`Anreise ${fLong(probe)}${t?`, ${t} Uhr`:''}${y.days[probe].city?' · '+y.days[probe].city:''}`});}
  y.shows.forEach(s=>out.push({at:s.date+'T'+(s.time||'00:00'),label:'Vorstellung '+s.city,sub:`${fLong(s.date)}, ${s.time} Uhr${s.venue&&s.venue!=='Beispielwert'?' · '+s.venue:''}`}));
  return out;
}
const upcoming=list=>list.filter(x=>new Date(x.at)>new Date()).sort((a,b)=>a.at.localeCompare(b.at));
function cdParts(at){
  let ms=Math.max(0,new Date(at)-new Date()); const d=Math.floor(ms/864e5); ms-=d*864e5; const h=Math.floor(ms/36e5); ms-=h*36e5; const m=Math.floor(ms/6e4); const sec=Math.floor((ms-m*6e4)/1e3);
  return [[d,d===1?'Tag':'Tage'],[h,'Std'],[m,'Min'],[sec,'Sek']].map(([v,l],i)=>`<div><b>${i?String(v).padStart(2,'0'):v}</b><span>${l}</span></div>`).join('');
}

/* ===================== Kalender (.ics / Google) ===================== */
const isTime=t=>/^\d{1,2}:\d{2}$/.test(String(t||'').trim());
const pad2=n=>String(n).padStart(2,'0');
function calSpan(date,from,to,defMin){ if(!isTime(from)) return {allDay:true,s:date.replace(/-/g,''),e:(()=>{const x=d0(date); x.setDate(x.getDate()+1); return `${x.getFullYear()}${pad2(x.getMonth()+1)}${pad2(x.getDate())}`;})()};
  const [h,m]=from.trim().split(':').map(Number); let st=new Date(+date.slice(0,4),+date.slice(5,7)-1,+date.slice(8,10),h,m), en;
  if(isTime(to)){ const [h2,m2]=to.trim().split(':').map(Number); en=new Date(st); en.setHours(h2,m2); if(en<=st) en.setDate(en.getDate()+1); } else en=new Date(st.getTime()+defMin*60000);
  const f=x=>`${x.getFullYear()}${pad2(x.getMonth()+1)}${pad2(x.getDate())}T${pad2(x.getHours())}${pad2(x.getMinutes())}00`; return {allDay:false,s:f(st),e:f(en)}; }
function calItems(kind,key){ const y=Y();
  if(kind==='show'||kind==='shows'){ const list=kind==='show'?y.shows.filter(x=>x.id===key):[...y.shows].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    return list.map(x=>({uid:`los-${y.year}-show-${x.id}`,...calSpan(x.date,x.time,'',180),title:`Libanon on Stage: ${y.play} – ${x.city}`,loc:[x.venue,x.addr].filter(Boolean).join(', '),desc:[`Vorstellung ${y.play}`,x.venue,x.getIn&&x.getIn!=='—'?'Get-in: '+x.getIn:''].filter(Boolean).join(' · ')})); }

function readPhoto(file,cb){

  r.onload=()=>{const img=new Image(); img.onload=()=>{const mx=360,sc=Math.min(1,mx/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.82));}; img.onerror=()=>cb(null); img.src=r.result;};
  r.onerror=()=>cb(null); r.readAsDataURL(file);
}

const STD_CREWS=[['leitung','Leitung',4],['regie','Regie',4],['ensemble','Schauspiel',14],['band','Band',4],['technik','Technik',3],['bautrupp','Bautrupp',4],['lkw','LKW-Fahrer',2],['requisite','Requisite',2],['kostuem','Kostüm',4],['mami','Mami',2]];

  const map=[[/regie|souffl|assist/,'regie'],[/schauspiel/,'ensemble'],[/\bband\b|musik/,'band'],[/technik|\bton\b|licht/,'technik'],[/lkw|fahrer/,'lkw'],[/bau/,'bautrupp'],[/requisit/,'requisite'],[/kostum|kostüm|maske/,'kostuem'],[/mami|kuche|küche|verpflegung/,'mami'],[/chor|gesang/,'chor'],[/leitung/,'leitung']];
  const exact=(y.crews||[]).find(c=>normName(c.label)===s); if(exact) return exact.g;
  const hit=map.find(([re,g])=>re.test(s)&&(y.crews||[]).some(c=>c.g===g)); return hit?hit[1]:''; }

function ensureCrews(y){
  if(!y||y.archived) return false; let changed=false; y.crews=y.crews||[];
  STD_CREWS.forEach(([g,label,target])=>{ if(!y.crews.some(c=>c.g===g)){ y.crews.push({g,label,target,lead:''}); changed=true; } });
  y.crews.forEach(c=>{ if(c.g==='technik'&&c.label==='Ton & Licht'){ c.label='Technik'; changed=true; } });
  const order=c=>{const i=STD_KEYS.indexOf(c.g); return i<0?99:i;};
  const sorted=[...y.crews].sort((a,b)=>order(a)-order(b)); if(sorted.some((c,i)=>c!==y.crews[i])){ y.crews=sorted; changed=true; }
  const keys=crewKeys(y);
  y.people.forEach(p=>{ if(p.fn&&fnFix(p.fn)!==p.fn){ p.fn=fnFix(p.fn); changed=true; } });
  y.people.filter(isAdminPerson).forEach(p=>{ /* Admin-Konten tauchen nicht in Team, Fahrten, Unterkünften oder Besetzung auf */
    y.roles.forEach(r=>{ if(r.person===p.id){r.person=''; r.status='frei';} if(r.alt===p.id) r.alt=''; });
    y.crews.forEach(c=>{ if(c.lead===p.id) c.lead=''; });
    y.events.forEach(ev=>ev.who=ev.who.filter(x=>x!=='p:'+p.id));
    y.trips.forEach(tr=>{ delete tr.assign[p.id]; Object.values(tr.veh||{}).forEach(v=>{ if(v.driver===p.id) v.driver=''; }); });
    y.stays.forEach(st=>st.persons=st.persons.filter(x=>x!==p.id));
    y.people=y.people.filter(x=>x!==p); changed=true; });
  y.people.forEach(p=>{ if(p.actWish===undefined&&p.fromReg){ const r=(y.registrations||[]).find(x=>x.id===p.fromReg); if(r){ p.actWish=r.roleWish||''; changed=true; } } });
  y.people.forEach(p=>{ const mine=(p.groups||[]).filter(g=>keys.includes(g)); if(mine.length>1){ const keep=mine.sort((a,b)=>keys.indexOf(a)-keys.indexOf(b))[0]; setCrew(p,keep,y); changed=true; } });
  return changed;
}

/* ---------- Gewerke-Übersicht ---------- */

    const lead=canLead&&c.lead&&ps.find(p=>p.id===c.lead); const ok=ps.length>=(+c.target||0); const open=ed&&ui.crewEdit===c.g;
    const rest=ps.filter(p=>p!==lead);
    return `<section class="panel crewcard"><div class="row" style="flex-wrap:nowrap"><h3 style="margin:0">${esc(c.label)}</h3>
      <span class="row" style="gap:6px;flex-wrap:nowrap">${L?`<span class="tag ${ok?'green':'red'}" title="besetzt / Plätze">${ps.length}/${+c.target||0}</span>`:`<span class="small muted">${ps.length}</span>`}${ed?`<button class="iconbtn" data-act="crew-edit" data-g="${c.g}" aria-expanded="${open}" title="Bearbeiten" aria-label="${esc(c.label)} bearbeiten">✎</button>`:''}</span></div>
      ${lead?`<div class="crewlead">★ <span class="small">${esc(leadLabel(c))}</span> <b>${esc(lead.name)}</b></div>`:canLead?`<div class="small muted" style="margin:8px 0 2px">${esc(leadLabel(c))}: noch offen</div>`:''}
      ${rest.length?`<ul class="crewlist">${rest.map(p=>`<li>${esc(p.name)}${sub(p,c)?` <span class="muted">· ${esc(sub(p,c))}</span>`:''}</li>`).join('')}</ul>`:lead?'':'<p class="small muted" style="margin:8px 0 0">Noch niemand</p>'}
      ${open?`<div class="crewedit">
        ${L?`<label class="small" style="display:flex;gap:6px;align-items:center">Plätze<input type="number" min="0" value="${+c.target||0}" data-act="crew-target" data-g="${c.g}" aria-label="Plätze ${esc(c.label)}" style="width:64px;padding:3px 6px"></label>`:''}
        ${canLead?`<label class="f">${esc(leadLabel(c))}<select data-act="crewlead" data-g="${c.g}"><option value="">— noch niemand —</option>${ps.map(p=>`<option value="${p.id}" ${lead&&p.id===lead.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`:''}
        ${c.g==='regie'&&ps.length?`<div class="fnlist">${ps.map(p=>`<label class="fnrow"><span>${esc(p.name)}</span><select data-act="pfn" data-p="${p.id}" aria-label="Funktion von ${esc(p.name)}"><option value="">Funktion …</option>${REGIE_FN.map(x=>`<option ${p.fn===x?'selected':''}>${x}</option>`).join('')}</select></label>`).join('')}</div>`:''}
        <p class="small muted" style="margin:0">Wer in diesem Gewerk ist, legt ihr in der Teamübersicht fest.</p>
        ${!STD_KEYS.includes(c.g)?`<button class="btn ghost" data-act="crew-del" data-g="${c.g}" style="padding:2px 8px;font-size:13px;color:var(--muted);align-self:flex-start">Sondergewerk löschen</button>`:''}</div>`:''}</section>`;};
  return `<p class="small muted" style="margin-top:-6px">Wer in welchem Gewerk ist – und wer jeweils dafür verantwortlich ist.${ed?' Plätze, Chef und Regie-Funktionen über ✎.':''}</p>
  <div class="grid3">${y.crews.map(card).join('')}</div>
  ${ed?`<details style="margin-top:14px"><summary class="small" style="cursor:pointer">Sondergewerk für dieses Jahr hinzufügen (z. B. Chor)</summary>
    <div class="row" style="justify-content:flex-start;margin-top:8px"><input type="text" id="nc-crew" placeholder="z. B. Chor" aria-label="Name"><input type="number" id="nc-target" min="0" value="4" style="width:70px" aria-label="Plätze"><button class="btn" data-act="crew-add">Anlegen</button></div></details>`:''}`;

/* ---------- Teamübersicht ---------- */
function teamOver(y){
  const ed=canEdit(); const f=ui.overFilter||'alle';
  const regOf=p=>p.fromReg&&y.registrations.find(r=>r.id===p.fromReg);
  const keys=crewKeys(y);
  let list=[...y.people].sort((a,b)=>{const ca=crewOf(a,y), cb=crewOf(b,y); const ia=ca?keys.indexOf(ca.g):-1, ib=cb?keys.indexOf(cb.g):-1; return ia-ib||a.name.localeCompare(b.name);});
  const none=list.filter(p=>!crewOf(p,y)); const actN=list.filter(p=>acts(p,y)).length;
  if(f==='ohne') list=none; else if(f==='acts') list=list.filter(p=>acts(p,y)); else if(f!=='alle') list=list.filter(p=>crewOf(p,y)?.g===f);
  const chips=y.crews.map(c=>{const n=y.people.filter(p=>crewOf(p,y)?.g===c.g).length; const full=n>=(+c.target||0);
    return `<button class="crewchip" data-act="overfilter" data-f="${c.g}" aria-pressed="${f===c.g}">${esc(c.label)} <span class="${full?'okline':'warnline'}">${n}/${+c.target||0}</span></button>`;}).join('');
  const hint=p=>{const c=crewOf(p,y); if(!c) return '';
    if(c.g==='leitung') return `<span class="tag">${esc(p.pos||'Leitung')}</span>`;
    if(c.g==='regie') return ed?`<select data-act="pfn" data-p="${p.id}" aria-label="Funktion in der Regie"><option value="">Funktion …</option>${REGIE_FN.map(x=>`<option ${p.fn===x?'selected':''}>${x}</option>`).join('')}</select>`:(p.fn?`<span class="tag">${esc(p.fn)}</span>`:'');
    return c.lead===p.id?`<span class="tag gold">${esc(leadLabel(c))}</span>`:''; };
  const actCell=p=>{ if(isDirector(p,y)) return '<span class="small muted">— (Regisseur)</span>'; const on=acts(p,y), w=wishLabel(p,y);
    const sub=w?`<div class="small muted">${esc(w)}</div>`:'';
    return ed?`<select data-act="setacts" data-p="${p.id}" aria-label="Schauspiel ${esc(p.name)}" class="${on?'onsel':''}"><option value="ja" ${on?'selected':''}>Ja</option><option value="nein" ${on?'':'selected'}>Nein</option></select>${sub}`:`${on?'Ja':'Nein'}${sub}`; };
  ui.mailSel=ui.mailSel||{}; Object.keys(ui.mailSel).forEach(id=>{ if(!y.people.some(p=>p.id===id)) delete ui.mailSel[id]; });
  const nSel=Object.keys(ui.mailSel).length, allIn=list.length&&list.every(p=>ui.mailSel[p.id]);
  const mailbar=ed?`<div class="mailbar"><span>✉ <b>${nSel?nSel+' ausgewählt':'Mail ans Team'}</b></span>
    <button class="btn ${nSel?'primary':''}" data-act="mail-sel" ${nSel?'':'disabled'}>Mail an Ausgewählte</button>
    <button class="btn" data-act="mail-all">Mail an alle (${y.people.length})</button>
    <button class="btn ghost" data-act="mail-copy" title="Adressen in die Zwischenablage – z. B. für sehr viele Empfänger">Adressen kopieren</button>
    ${nSel?'<button class="btn ghost" data-act="msel-none">Auswahl aufheben</button>':''}
    <span class="small muted">Häkchen links setzen · über die Filter oben z. B. ein ganzes Gewerk auswählen · Leitung kommt ins CC, alle anderen ins BCC</span></div>`:'';
  return `${mailbar}<div class="chips" style="margin:-4px 0 10px"><button class="crewchip" data-act="overfilter" data-f="alle" aria-pressed="${f==='alle'}">Alle ${y.people.length}</button>${none.length||f==='ohne'?`<button class="crewchip" data-act="overfilter" data-f="ohne" aria-pressed="${f==='ohne'}">Ohne Gewerk <span class="warnline">${none.length}</span></button>`:''}<button class="crewchip" data-act="overfilter" data-f="acts" aria-pressed="${f==='acts'}">Schauspiel: Ja <span class="muted">${actN}</span></button>${chips}</div>
  <p class="small muted" style="margin:0 0 10px">Jede Person ist in genau einem Gewerk – beim Zulassen übernommen aus der Anmeldung, hier jederzeit änderbar. „Schauspiel“ kommt aus dem Formular (Haupt- oder Nebenrolle angekreuzt); wer trotzdem auf die Bühne soll, bekommt hier ein Ja und lässt sich dann besetzen. Entfernen geht unter „Anmeldungen → Zugelassen“.</p>
  ${list.length?`<section class="panel" style="padding:4px 16px"><div class="trow thead overrow"><div>${ed?`<input type="checkbox" data-act="msel-all" ${allIn?'checked':''} aria-label="Alle in dieser Ansicht auswählen" style="margin-right:8px">`:''}Name</div><div>Gewerk</div><div>Schauspiel</div><div>Hinweis</div></div>
  ${list.map(p=>{const r=regOf(p), c=crewOf(p,y); const wish=r?(r.wishes||[]).join(', '):'';
    return `<div class="trow overrow"><div class="tname">${ed?`<input type="checkbox" data-act="msel" data-p="${p.id}" ${ui.mailSel[p.id]?'checked':''} aria-label="${esc(p.name)} auswählen">`:''}${ava(p.id,30)}<div><b>${esc(p.name)}</b>${wish?`<div class="small muted">Wunsch: ${esc(wish)}</div>`:''}</div></div>
    <div data-label="Gewerk">${ed?`<select data-act="setcrew" data-p="${p.id}" aria-label="Gewerk ${esc(p.name)}" class="${c?'':'warnsel'}">${c?'':'<option value="" selected disabled>— bitte wählen —</option>'}${y.crews.map(x=>`<option value="${x.g}" ${c&&c.g===x.g?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`:esc(c?c.label:'—')}</div>
    <div data-label="Schauspiel">${actCell(p)}</div>
    <div ${hint(p)?'data-label="Hinweis"':''}>${hint(p)}</div></div>`;}).join('')}</section>`:empty(f==='ohne'?'Alle haben ein Gewerk.':'Niemand in dieser Auswahl.')}`;
}

/* ===================== Aufgaben ===================== */
const AREAS=['Externe Leitung','Interne Leitung','Logistik & Finanzen','MFD'];
const OWNER={'Externe Leitung':'p-ext','Interne Leitung':'p-int','Logistik & Finanzen':'p-log','MFD':'p-mfd'};
const PHASES=['Abwicklung Vorjahr','Planung','Spielorte','Team & Besetzung','Probewoche','Tour','Nachbereitung'];
function taskRow(t,ed){const late=!t.done&&daysUntil(t.due)<0;const soon=!t.done&&!late&&daysUntil(t.due)<=7;
  return `<div class="task ${t.done?'done':''}" ${late?'style="background:var(--red-soft);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:6px"':''}><input type="checkbox" aria-label="Erledigt" data-act="task" data-id="${t.id}" ${t.done?'checked':''} ${ed?'':'disabled'}>
  <div><div class="tt">${esc(t.title)}</div><div class="small muted">${esc(t.area)} · ${esc(pname(t.owner))}${t.rec?' · <span class="tag" style="font-size:11.5px">Vorlage</span>':''}${t.link?` · ${lnk(t.link)}`:''}</div></div>
  <div class="small" style="text-align:right;${late?'color:var(--red);font-weight:700':soon?'color:var(--amber);font-weight:600':''}">${fDate(t.due,{day:'numeric',month:'short'})}${late?`<br>${-daysUntil(t.due)} Tage überfällig`:soon?'<br>diese Woche':''}</div></div>`;}
function vTasks(){
  const y=Y(); const ed=canEdit();
  let ts=y.tasks.filter(t=>ui.taskArea==='alle'||t.area===ui.taskArea);
  const late=ts.filter(t=>!t.done&&daysUntil(t.due)<0);
  if(ui.taskOpen) ts=ts.filter(t=>!t.done);
  ts=ts.filter(t=>!late.includes(t));
  return `<h1>Aufgaben</h1><p class="lede">Überfällige Aufgaben rutschen nach oben, werden rot markiert und erscheinen im Dashboard und als Zähler im Menü. „Vorlage“ heißt: wird im nächsten Jahr automatisch wieder angelegt.</p>
  <div class="row" style="justify-content:flex-start;gap:14px;margin-bottom:18px">
    <div class="seg" role="group" aria-label="Bereich">${['alle',...AREAS].map(a=>`<button data-act="taskarea" data-a="${esc(a)}" aria-pressed="${ui.taskArea===a}">${a==='alle'?'Alle':a==='Logistik & Finanzen'?'Logistik':a.replace(' Leitung','. L.')}</button>`).join('')}</div>
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-act="taskopen" ${ui.taskOpen?'checked':''}> nur offene</label></div>
  ${ed?`<details class="form"><summary style="cursor:pointer;font-weight:600">Neue Aufgabe</summary>${taskFields('nt')}<button class="btn primary" data-act="task-add">Aufgabe anlegen</button></details>`:''}
  ${late.length?`<section class="phase panel" style="border-color:var(--red)"><h3 style="color:var(--red)">Überfällig<span class="small" style="font-family:var(--body)">${late.length}</span></h3>${late.map(t=>taskRow(t,ed)).join('')}</section>`:''}
  ${PHASES.map(ph=>{const list=ts.filter(t=>t.phase===ph);if(!list.length) return '';
    return `<section class="phase panel"><h3>${ph}<span class="small muted" style="font-family:var(--body)">${list.length}</span></h3>${list.sort((a,b)=>a.due.localeCompare(b.due)).map(t=>taskRow(t,ed)).join('')}</section>`}).join('')}`;
}
function taskFields(p){
  return `<div class="grid" style="margin-top:10px"><label class="f" style="grid-column:span 2">Was ist zu tun?<input type="text" id="${p}-title"></label>
  <label class="f">Bereich<select id="${p}-area">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select></label>
  <label class="f">Phase<select id="${p}-phase">${PHASES.map(a=>`<option>${a}</option>`).join('')}</select></label>
  <label class="f">Bis<input type="date" id="${p}-due"></label>
  <label class="f">Link (optional)<input type="text" id="${p}-link" placeholder="z. B. Drive-Dokument"></label>
  <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="${p}-rec"> Vorlage für nächstes Jahr</label></div>`;
}
function readTask(p){
  const title=val(p+'-title'),due=val(p+'-due'); if(!title||!due) return null;
  const area=val(p+'-area');
  return {id:uid('t'),title,area,phase:val(p+'-phase'),owner:OWNER[area],due,done:false,rec:document.getElementById(p+'-rec').checked,link:val(p+'-link')};
}

/* ===================== Jahresvergleich ===================== */
const CATS=[['buehne','Bühnenbild'],['fahrt','Fahrtkosten'],['sonst','Sonstiges']];
const catOf=c=>c.cat||(c.id==='c1'?'buehne':(c.id==='c3'||c.id==='c4')?'fahrt':'sonst');
const COLS=[['total','Gesamt (Überschuss)'],['tickets','Ticketeinnahmen'],['donCash','Spenden bar'],['donOnline','Spenden online'],['stage','Kosten Bühnenbild'],['travel','Fahrtkosten'],['audience','Zuschauer gesamt'],['perHead','Spenden pro Zuschauer']];
function yearRow(y){
  const m=money(y); const sumCat=k=>y.costs.filter(c=>catOf(c)===k).reduce((a,c)=>a+costOf(c),0);
  return {total:m.forecast,tickets:m.tickets+m.box,donCash:+y.donCash,donOnline:+y.donOnline,stage:sumCat('buehne'),travel:sumCat('fahrt'),audience:m.audience,perHead:m.audience?((+y.donCash)+(+y.donOnline))/m.audience:0};
}
function vCompare(){
  const ed=isLeit();
  const fmt=(k,v)=>v===undefined||v===''||v===null?'—':k==='audience'?nf(v):k==='perHead'?new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(v):eur(v);
  const auto=Object.keys(S.years).sort((a,b)=>b-a).map(yr=>[+yr,yearRow(S.years[yr]),S.years[yr].archived?'automatisch · abgeschlossen':'automatisch · Stand heute']);
  const rows=[...auto,...Object.keys(S.history).filter(yr=>!S.years[yr]).sort((a,b)=>b-a).map(yr=>[+yr,S.history[yr],'manuell'])];
  return `<h1>Jahresvergleich</h1><p class="lede">Jahre, die in der App geplant werden (ab 2026), rechnen sich komplett selbst – auch alle künftigen Jahre erscheinen hier automatisch. Nur die Jahre davor tragt ihr einmal von Hand ein.</p>
  <div class="panel section small"><b>Woher die Zahlen kommen:</b> Ticketeinnahmen = Regiondo + Abendkasse aus den Spielorten · Spenden bar/online = Finanzen › Einnahmen · Kosten Bühnenbild und Fahrtkosten = alle Ausgaben-Posten mit dieser Kategorie (Finanzen › Ausgaben) · Zuschauer = verkaufte Tickets + Abendkasse · Gesamt = Einnahmen minus Tourkosten.</div>
  <section class="panel scroll-x" style="padding:0"><table class="t big-table"><thead><tr><th>Jahr</th>${COLS.map(([,l])=>`<th class="n">${l}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(([yr,r,src])=>{const manual=src==='manuell';const ph=manual&&r.audience?((+r.donCash||0)+(+r.donOnline||0))/r.audience:undefined;
    return `<tr><td><b>${yr}</b><div class="small"><span class="tag ${manual?'':'green'}" style="font-size:11.5px">${src}</span></div></td>${COLS.map(([k])=>`<td class="n">${manual?(k==='perHead'?fmt(k,ph):ed?`<input type="number" value="${r[k]??''}" data-act="hist" data-y="${yr}" data-k="${k}" aria-label="${k} ${yr}">`:fmt(k,r[k])):fmt(k,r[k])}</td>`).join('')}</tr>`}).join('')}
  </tbody></table></section>
  <p class="small muted">Gesamt = alle Einnahmen minus Tourkosten, also das, was für den Libanon übrig bleibt. Offene Jahre zeigen die Prognose.</p>`;
}

    case 'cost': y.costs.find(c=>c.id===el.dataset.id).actual=Math.max(0,+v||0); commit('Ist-Wert gespeichert.'); return;
    case 'closed': y.costs.find(c=>c.id===el.dataset.id).closed=el.checked; commit(); return;
    case 'costcat': y.costs.find(c=>c.id===el.dataset.id).cat=v; commit('Kategorie gespeichert – Jahresvergleich aktualisiert.'); return;
    case 'costplan': y.costs.find(c=>c.id===el.dataset.id).plan=Math.max(0,+v||0); commit('Plan gespeichert – Dashboard aktualisiert.'); return;
    case 'costname': {const n=v.trim(); if(!n){render();return} y.costs.find(c=>c.id===el.dataset.id).name=n; commit('Gespeichert.'); return;}
    case 'doncash': y.donCash=Math.max(0,+v||0); commit('Gespeichert.'); return;
    case 'msel': ui.mailSel=ui.mailSel||{}; if(el.checked) ui.mailSel[el.dataset.p]=true; else delete ui.mailSel[el.dataset.p]; renderKeep(); return;
    case 'msel-all': {ui.mailSel=ui.mailSel||{}; const ids=[...document.querySelectorAll('[data-act="msel"]')].map(x=>x.dataset.p); ids.forEach(id=>{ if(el.checked) ui.mailSel[id]=true; else delete ui.mailSel[id]; }); renderKeep(); return;}
    case 'rolesel': if(setRole(v)) render(); return;
    case 'daypick': setDay(el.dataset.ctx,v); render(); return;
    case 'day-title': if(y.days[el.dataset.d]){ y.days[el.dataset.d].title=v.trim(); commit(); } return;
    case 'day-kind': if(y.days[el.dataset.d]){ y.days[el.dataset.d].kind=v; commit(); } return;
    case 'goal': if(!isLeit()) return; y.goal=Math.max(0,Math.round(+v||0)); commit(`Spendenziel: ${eur(y.goal)}.`); return;
    case 'donon': y.donOnline=Math.max(0,+v||0); commit('Gespeichert.'); return;
    case 'other': y.other.find(o=>o.id===el.dataset.id).amount=Math.max(0,+v||0); commit('Gespeichert.'); return;
    case 'assign': {const t=trip(); if(v) t.assign[el.dataset.p]=v; else delete t.assign[el.dataset.p];
      Object.entries(t.veh).forEach(([k,d])=>{if(d.driver===el.dataset.p&&v!==k) d.driver=''}); commit(); return;}
    case 'driver': {const t=trip(); t.veh[el.dataset.v]=t.veh[el.dataset.v]||{}; t.veh[el.dataset.v].driver=v; commit(); return;}
    case 'vseats': {const v=y.vehicles.find(x=>x.id===el.dataset.v); v.seats=Math.max(1,+el.value||1); commit(); return;}
    case 'vtime': {const t=trip(); t.veh[el.dataset.v]=t.veh[el.dataset.v]||{}; t.veh[el.dataset.v].time=v.trim(); commit(); return;}
    case 'vplace': {const t=trip(); t.veh[el.dataset.v]=t.veh[el.dataset.v]||{}; t.veh[el.dataset.v].place=v.trim(); commit(); return;}
    case 'bahninfo': {const t=trip(); const [time,...rest]=v.split('·'); t.veh.bahn={time:(time||'').trim(),place:rest.join('·').trim(),driver:''}; commit(); return;}
    case 'crew-label': {const c=y.crews.find(x=>x.g===el.dataset.g); const n=v.trim(); if(!n){render();return} c.label=n; commit('Gewerk umbenannt.'); return;}
    case 'crew-target': {const c=y.crews.find(x=>x.g===el.dataset.g); c.target=Math.max(0,+v||0); commit(); return;}
    case 'crew-in': {if(!v) return; const p=y.people.find(x=>x.id===v), c=y.crews.find(x=>x.g===el.dataset.g); p.groups.push(c.g); commit(`${p.name} ist jetzt in ${c.label}.`); return;}
    case 'rolekind': {const r=y.roles.find(x=>x.id===el.dataset.id);
      if(v==='haupt'&&r.person){ const o=mainRoleOf(r.person,y,r.id); if(o){toast(`${castLabel(r.person,true)} spielt schon die Hauptrolle ${o.name} – erst umbesetzen.`);render();return} }
      r.kind=v; commit(v==='haupt'?'Jetzt Hauptrolle.':'Jetzt Nebenrolle.'); return;}
    case 'ms-date': case 'ms-time': case 'ms-label': case 'ms-team': {const m=y.milestones[+el.dataset.i]; if(!m) return;
      if(a==='ms-date'){ if(!v){render();return} m.date=v; } else if(a==='ms-time'){ const t=v.trim(); if(t&&!/^\d{1,2}:\d{2}$/.test(t)){toast('Uhrzeit bitte als 18:30 eintragen – oder leer lassen.');render();return} m.time=t?t.padStart(5,'0'):''; }
      else if(a==='ms-label'){ if(!v.trim()){render();return} m.label=v.trim(); } else m.team=el.checked;
      commit(); return;}
    case 'crewlead': {const c=y.crews.find(x=>x.g===el.dataset.g); c.lead=v; commit(v?`${pname(v)} ist jetzt ${leadLabel(c)}.`:`${leadLabel(c)} entfernt.`); return;}
    case 'sheet-file': {const f=el.files?.[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{const res=importSheet(y,rd.result); if(res.error){toast(res.error);return} commit(`Abgleich fertig: ${res.added} neu, ${res.updated} aktualisiert.`);}; rd.onerror=()=>toast('Die Datei konnte nicht gelesen werden.'); rd.readAsText(f,'utf-8'); return;}
    case 'castalt': {const r=y.roles.find(x=>x.id===el.dataset.id); if(v&&v===r.person){toast('Das ist schon die Hauptbesetzung.');render();return}
      r.alt=v; commit(v?`${castLabel(v,true)} als Zweitbesetzung für ${r.name} eingetragen.`:'Zweitbesetzung entfernt.'); return;}
    case 'photo-up': {const f=el.files?.[0]; if(!f) return; const tok=el.dataset.tok; readPhoto(f,url=>{if(!url){toast('Das Bild konnte nicht gelesen werden.');return}
      const i=tokInfo(tok); if(i.reg){i.reg.photoUrl=url; i.reg.photo=true;} else i.person.photo=url; save(); render(); showPhoto(tok); toast('Foto gespeichert.');}); return;}
    case 'cast': {const r=y.roles.find(x=>x.id===el.dataset.id);
      if(v&&isDirector(person(v),y)){toast('Regisseure stehen nicht auf der Bühne.');render();return}
      if(v&&isMain(r)){ const o=mainRoleOf(v,y,r.id); if(o){toast(`${castLabel(v,true)} spielt schon die Hauptrolle ${o.name} – höchstens als Zweitbesetzung oder in einer Nebenrolle.`);render();return} }
      r.person=v; if(v&&r.alt===v) r.alt=''; r.status=v?(ui.role==='regie'?'bestätigt':'vorgeschlagen'):'frei';
      commit(v?(ui.role==='regie'?`${castLabel(v,true)} als ${r.name} besetzt.`:`${castLabel(v,true)} für ${r.name} vorgeschlagen – wartet auf die Regie.`):''); return;}
    case 'role-name': {const r=y.roles.find(x=>x.id===el.dataset.id); const n=v.trim(); if(!n){render();return} r.name=n; commit('Rolle umbenannt.'); return;}
    case 'setcrew': {const p=y.people.find(x=>x.id===el.dataset.p); if(!v){render();return} setCrew(p,v,y); if(v==='ensemble') p.acts=true;
      commit(`${p.name} ist jetzt in ${gLabel(v)}.`); return;}
    case 'setacts': {const p=y.people.find(x=>x.id===el.dataset.p); const on=v==='ja';
      const rs=y.roles.filter(r=>r.person===p.id||r.alt===p.id);
      const apply=()=>{ if(!on) y.roles.forEach(r=>{ if(r.person===p.id){r.person='';r.status='frei';} if(r.alt===p.id) r.alt=''; }); p.acts=on;
        commit(on?`${p.name} steht jetzt in der Schauspieler-Übersicht und kann besetzt werden.`:`${p.name} spielt nicht mit.`); };
      if(!on&&rs.length){ render(); ask(`${p.name} spielt noch: ${rs.map(r=>r.name).join(', ')}. Trotzdem aus dem Schauspiel nehmen? Die Rollen werden frei.`,'Ja, Rollen freigeben',apply); return; }
      apply(); return;}
    case 'pfn': {const p=y.people.find(x=>x.id===el.dataset.p); p.fn=v;
      if(v==='Regisseur'&&y.roles.some(r=>r.person===p.id||r.alt===p.id)){ y.roles.forEach(r=>{ if(r.person===p.id){r.person='';r.status='frei';} if(r.alt===p.id) r.alt=''; }); commit(`${p.name} führt Regie – seine Rollen sind wieder frei.`); return; }
      commit(); return;}
    case 'hist': {S.history[el.dataset.y][el.dataset.k]=v===''?'':+v; commit(); return;}
    case 'pmail': {const p=CUR().people.find(x=>x.id===el.dataset.p); const m=mails(v);
      if(v.trim()&&!m.length){toast('Das sieht nicht wie eine E-Mail-Adresse aus.');render();return}
      if(m.some(isAdminMail)){toast('Das ist ein Admin-Konto – bitte die persönliche Adresse eintragen.');render();return}
      const other=CUR().people.find(x=>x.id!==p.id&&mails(x.email).some(a=>m.includes(a)));
      if(LIVE&&mails(p.email).includes(auth.email)&&!m.includes(auth.email)&&!BOOT.includes(auth.email)){toast('Deine eigene Anmelde-Adresse kann nur jemand anderes aus der Leitung entfernen.');render();return}
      p.email=m.join(', '); commit(m.length?`${p.name} kann sich jetzt mit ${m.join(' oder ')} anmelden.${other?` Die Adresse teilt sie sich mit ${other.name} – beim Anmelden wählt man, wer man ist.`:''}`:`${p.name} hat keinen Zugang mehr.`); return;}
    case 'pname': {const p=CUR().people.find(x=>x.id===el.dataset.p); const n=v.trim(); if(!n){toast('Der Name darf nicht leer sein.');render();return} p.name=n; commit(`Name geändert: ${n}`); return;}
    case 'access': {const p=CUR().people.find(x=>x.id===el.dataset.p);
      if(LIVE&&mails(p.email).includes(auth.email)&&!v.startsWith('leitung')&&!BOOT.includes(auth.email)){toast('Deine eigene Rolle kann nur jemand anderes aus der Leitung ändern.');render();return}
      p.access=v; let note='';
      const c=crewOf(p,CUR()); if(v.startsWith('leitung')){ setCrew(p,'leitung',CUR()); p.pos=ACCESS[v].replace('Leitung – ','');
        const pid=POS_ID[v], cy=CUR(); if(pid&&pid!==p.id&&!cy.people.some(x=>x.id===pid)){ const n=cy.tasks.filter(t=>t.owner===pid).length; cy.tasks.forEach(t=>{ if(t.owner===pid) t.owner=p.id; }); if(n) note=` · übernimmt ${n} Aufgaben der Position`; } } else if(v==='regie'||v==='ra'){ setCrew(p,'regie',CUR()); if(!p.fn) p.fn=v==='ra'?'Regie-Assistenz':'Regisseur'; } else if(c&&(c.g==='leitung'||c.g==='regie')) setCrew(p,'',CUR());
      commit(`${p.name}: ${ACCESS[v]}${note}`); return;}
  }
});
document.addEventListener('input',e=>{const r=e.target.closest&&e.target.closest('[data-yrrow]'); if(!r) return;
  const k=+r.dataset.yrrow, dirty=String(val('yn-'+k))!==String(k)||val('pn-'+k)!==S.years[k].play;
  r.querySelector('[data-act="yr-save"]').classList.toggle('primary',dirty); r.querySelector('.unsaved').hidden=!dirty;});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='li-mail'||e.target.id==='lm-mail')){e.preventDefault(); e.target.id==='li-mail'?sendLink():document.querySelector('[data-act="link-finish"]')?.click(); return;}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enterSave){e.preventDefault();document.querySelector(`[data-act="yr-save"][data-y="${e.target.dataset.enterSave}"]`)?.click();return}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();document.querySelector(`[data-act="cm-add"][data-id="${e.target.dataset.enter}"]`)?.click();return}
  if(e.key==='Escape'){if(document.getElementById('pv')){closePv();return} if(pendingFn){closeAsk();return} if(ui.sheet){ui.sheet=false;render()}}});
if(!LIVE) Object.values(S.years).forEach(y=>ensureCrews(y));
render();
if(LIVE) liveInit();

</script>
<script>/* Android: als App installierbar machen (kein Zwischenspeicher, siehe sw.js) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel="manifest"]')) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
